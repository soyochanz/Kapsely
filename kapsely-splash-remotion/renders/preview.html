<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapsely Splash Preview</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f1ff;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .frame {
        width: min(340px, calc(100vw - 24px));
        aspect-ratio: 853 / 1844;
        border-radius: 26px;
        overflow: hidden;
        background: #f7f3ff;
        box-shadow:
          0 30px 90px rgba(116, 89, 198, 0.2),
          0 12px 28px rgba(116, 89, 198, 0.12);
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <video src="./kapsely-splash-open.webm" autoplay muted loop playsinline controls></video>
    </div>
  </body>
</html>
